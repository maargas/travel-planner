<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}Compass — Roteiros de viagem{% endblock %}</title>
  <meta name="description" content="Roteiro de viagem verificado nas suas datas reais.">

  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1a1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Compass">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="icon" href="/static/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Palettes, straight from the Compass design ───────────────────────────
       Every colour on the page reads from a --t-* token, so switching the theme
       attribute on <html> repaints the whole app with no other change. */
    :root,
    [data-theme="plum"] {
      --t-bg:#1a1020; --t-surface:#251630; --t-surface-2:#35213f; --t-text:#f6edf6; --t-muted:#b49bb8;
      --t-chrome:#120a17; --t-border:rgba(246,237,246,0.11);
      --t-accent:#eb9a5c; --t-accent-soft:#f7c294; --t-accent-deep:#8a4a22; --t-accent-ink:#1a1020;
      --t-ink-wash:rgba(255,255,255,0.045);
    }
    [data-theme="ember"] {
      --t-bg:#14110f; --t-surface:#1d1917; --t-surface-2:#2b2421; --t-text:#f7f1ea; --t-muted:#ab9d90;
      --t-chrome:#0e0c0b; --t-border:rgba(247,241,234,0.10);
      --t-accent:#e0a32e; --t-accent-soft:#f3c96a; --t-accent-deep:#8a5f10; --t-accent-ink:#171310;
      --t-ink-wash:rgba(255,255,255,0.045);
    }
    [data-theme="blueprint"] {
      --t-bg:#10172e; --t-surface:#182142; --t-surface-2:#24305c; --t-text:#edf1ff; --t-muted:#9aa7cf;
      --t-chrome:#0b1122; --t-border:rgba(237,241,255,0.11);
      --t-accent:#59c1f5; --t-accent-soft:#9adcff; --t-accent-deep:#1d5c85; --t-accent-ink:#0a1020;
      --t-ink-wash:rgba(255,255,255,0.045);
    }
    [data-theme="terracotta"] {
      --t-bg:#f6ece0; --t-surface:#fffaf2; --t-surface-2:#ecdcc7; --t-text:#241c16; --t-muted:#6b5a4a;
      --t-chrome:#efe2d1; --t-border:rgba(36,28,22,0.14);
      --t-accent:#b4552b; --t-accent-soft:#e39a63; --t-accent-deep:#7d3616; --t-accent-ink:#fff6ec;
      --t-ink-wash:rgba(0,0,0,0.045);
    }
    [data-theme="seaglass"] {
      --t-bg:#eef3ee; --t-surface:#ffffff; --t-surface-2:#dbe7e0; --t-text:#10201c; --t-muted:#4b5f58;
      --t-chrome:#e3ede7; --t-border:rgba(16,32,28,0.13);
      --t-accent:#14655a; --t-accent-soft:#6fb3a4; --t-accent-deep:#0b453d; --t-accent-ink:#f2fbf8;
      --t-ink-wash:rgba(0,0,0,0.045);
    }

    /* The design defines no error colour, so one is added per light/dark ground. */
    :root { --t-danger: #e8806f; --t-danger-bg: rgba(232,128,111,0.12); }
    [data-theme="terracotta"], [data-theme="seaglass"] {
      --t-danger: #a8321f; --t-danger-bg: rgba(168,50,31,0.09);
    }

    :root {
      --font-heading: "Caprasimo", Georgia, serif;
      --font-body:    "Figtree", system-ui, -apple-system, sans-serif;

      --t-radius-sm: 11px;
      --t-radius: 18px;
      --t-radius-lg: 28px;
      --t-pill: 999px;

      --shadow-md: 0 3px 10px rgba(0,0,0,0.28);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.34);

      --nav-h: 4.5rem;
      --side-w: 232px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--t-bg);
      /* The "topo" texture from the design: faint concentric contour rings. */
      background-image: repeating-radial-gradient(circle at 82% 8%, transparent 0 26px, var(--t-ink-wash) 26px 27px);
      background-attachment: fixed;
      color: var(--t-text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      padding: 0 max(1rem, env(safe-area-inset-left));
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
      overflow-x: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    h1, h2, h3 { font-family: var(--font-heading); font-weight: 400; line-height: 1.12; letter-spacing: -0.015em; }
    a { color: var(--t-accent); }

    .wrap { max-width: 38rem; margin: 0 auto; }

    /* ── Shared pieces ─────────────────────────────────────────────────── */

    .card {
      background: var(--t-surface);
      border: 1px solid var(--t-border);
      border-radius: var(--t-radius-lg);
      box-shadow: var(--shadow-md);
      padding: 1.375rem;
    }

    .page-head { padding: 1.75rem 0 1.25rem; }
    .page-head h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .page-head .sub { font-size: 0.8125rem; color: var(--t-muted); }

    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 0.75rem; margin: 1.5rem 0 0.75rem;
    }
    .section-head h2 { font-size: 1rem; }
    .section-head .more { font-size: 0.75rem; color: var(--t-accent); font-weight: 700; text-decoration: none; }

    .row-item {
      display: flex; gap: 0.75rem; align-items: center;
      background: var(--t-surface); border: 1px solid var(--t-border);
      border-radius: var(--t-radius); padding: 0.75rem;
    }
    .row-icon {
      width: 2.75rem; height: 2.75rem; flex: none;
      border-radius: var(--t-radius-sm);
      display: flex; align-items: center; justify-content: center;
      background: var(--t-surface-2); color: var(--t-accent);
    }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-size: 0.875rem; font-weight: 700; }
    .row-sub { font-size: 0.75rem; color: var(--t-muted); }
    .row-value { font-size: 0.875rem; font-weight: 700; }

    .stack { display: flex; flex-direction: column; gap: 0.625rem; }

    .tag {
      display: inline-flex; align-items: center;
      font-size: 0.6875rem; font-weight: 700;
      padding: 0.1875rem 0.625rem; border-radius: var(--t-pill);
    }
    .tag-soft { background: var(--t-surface-2); color: var(--t-accent); }
    .tag-outline { border: 1px solid var(--t-accent); color: var(--t-accent); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
      width: 100%; padding: 0.875rem;
      border: 1px solid transparent; border-radius: var(--t-pill);
      font-family: var(--font-heading); font-size: 0.9375rem;
      cursor: pointer; text-decoration: none;
    }
    .btn-primary { background: var(--t-accent); color: var(--t-accent-ink); }
    .btn-primary:hover { background: var(--t-accent-soft); }
    .btn-outline { border-color: var(--t-border); color: var(--t-accent); background: transparent; }
    .btn-outline:hover { background: var(--t-surface-2); }
    .btn:focus-visible { outline: 2px solid var(--t-accent); outline-offset: 2px; }

    .sample-note {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--t-surface-2); border: 1px solid var(--t-accent);
      border-radius: var(--t-radius);
      padding: 0.625rem 0.875rem; margin: 0.5rem 0 1rem;
      font-size: 0.75rem; line-height: 1.4;
    }
    .sample-note strong { color: var(--t-accent); }

    /* ── Mobile tab bar ─────────────────────────────────────────────────── */

    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; justify-content: space-around; align-items: center;
      background: var(--t-chrome); border-top: 1px solid var(--t-border);
      padding: 0.625rem 0 calc(0.625rem + env(safe-area-inset-bottom));
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 0.1875rem;
      color: var(--t-muted); text-decoration: none;
      font-size: 0.625rem; font-weight: 600;
      padding: 0.125rem 0.75rem; min-width: 3.5rem;
    }
    .tab[aria-current="page"] { color: var(--t-accent); }
    .tab svg { display: block; }
    .tab:focus-visible { outline: 2px solid var(--t-accent); outline-offset: 2px; border-radius: 0.5rem; }

    .sidebar { display: none; }

    /* ── Theme picker ───────────────────────────────────────────────────── */

    .theme-bar {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
      padding: 0.75rem 0 0.25rem;
    }
    .theme-bar .lbl {
      font-size: 0.625rem; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--t-muted); font-weight: 700;
    }
    .swatch {
      width: 1.75rem; height: 1.75rem; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer; padding: 0;
      position: relative;
    }
    .swatch[aria-pressed="true"] { border-color: var(--t-accent); }
    .swatch:focus-visible { outline: 2px solid var(--t-accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 3s !important; }
    }

    /* ── Desktop: the Compass window from the design ────────────────────── */

    @media (min-width: 60rem) {
      :root { --nav-h: 0rem; }

      body {
        padding: 0; padding-bottom: 0;
        display: flex; min-height: 100vh;
      }

      .tabbar { display: none; }

      .sidebar {
        display: flex; flex-direction: column;
        position: sticky; top: 0; align-self: flex-start;
        width: var(--side-w); flex: none; height: 100vh;
        background: var(--t-chrome); border-right: 1px solid var(--t-border);
        padding: 1rem 0.75rem; overflow-y: auto;
      }

      .side-brand { display: flex; align-items: center; gap: 0.625rem; padding: 0 0.5rem 1rem; }
      .side-mark {
        width: 1.875rem; height: 1.875rem; border-radius: var(--t-radius-sm);
        background: var(--t-accent); color: var(--t-accent-ink);
        display: flex; align-items: center; justify-content: center; flex: none;
      }
      .side-name { font-family: var(--font-heading); font-size: 1rem; }

      .side-search {
        display: flex; align-items: center; gap: 0.5625rem;
        background: var(--t-surface); border: 1px solid var(--t-border);
        border-radius: var(--t-pill); padding: 0.4375rem 0.75rem; margin: 0 0.25rem 1rem;
        font-size: 0.78125rem; color: var(--t-muted); width: calc(100% - 0.5rem);
        cursor: pointer; font-family: inherit; text-align: left;
      }
      .side-search .k {
        font-size: 0.65625rem; border: 1px solid var(--t-border);
        border-radius: 5px; padding: 0.0625rem 0.3125rem;
      }

      .side-group { font-size: 0.65625rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--t-muted); padding: 0 0.75rem 0.4375rem; }
      .side-nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 1.25rem; }

      .side-link {
        display: flex; align-items: center; gap: 0.6875rem;
        padding: 0.5625rem 0.75rem; border-radius: var(--t-radius-sm);
        color: var(--t-muted); text-decoration: none; font-size: 0.8125rem; font-weight: 600;
      }
      .side-link svg { flex: none; }
      .side-link span { flex: 1; }
      .side-link:hover { background: var(--t-surface); color: var(--t-text); }
      .side-link[aria-current="page"] { background: var(--t-surface-2); color: var(--t-text); }
      .side-link[aria-current="page"] svg { color: var(--t-accent); }
      .side-link .side-badge {
        flex: none; font-size: 0.65625rem; font-weight: 700;
        background: var(--t-surface-2); color: var(--t-muted);
        border-radius: var(--t-pill); padding: 0.0625rem 0.4375rem;
      }
      .side-link.soon { opacity: 0.5; cursor: default; }
      .side-link.soon:hover { background: transparent; color: var(--t-muted); }

      .side-foot { margin-top: auto; padding: 0.75rem 0.5rem 0; border-top: 1px solid var(--t-border); }

      /* The picker lives in the sidebar footer here, so the in-page copy goes away. */
      #theme-bar-mobile { display: none; }

      .wrap {
        flex: 1; min-width: 0; max-width: none;
        padding: 1.5rem 2.5rem 3rem;
        margin: 0;
      }
      .wrap > * { max-width: 54rem; }
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>
<body>

<!-- Desktop: the sidebar from the Compass design -->
<aside class="sidebar">
  <div class="side-brand">
    <div class="side-mark" aria-hidden="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M16 8l-5 3-3 5 5-3 3-5z"></path></svg>
    </div>
    <span class="side-name">Compass</span>
  </div>

  <button class="side-search" type="button" data-soon>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span style="flex:1;">Buscar</span>
    <span class="k">Ctrl K</span>
  </button>

  <div class="side-group">Esta viagem</div>
  <nav class="side-nav" aria-label="Seções da viagem">
    <a class="side-link" href="/painel" {% if page == 'painel' %}aria-current="page"{% endif %}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"></path></svg>
      <span>Visão geral</span>
    </a>
    <a class="side-link" href="/" {% if page == 'planejar' %}aria-current="page"{% endif %}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M3 10h18M8 2v4M16 2v4"></path></svg>
      <span>Roteiro</span>
    </a>
    <span class="side-link soon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <span>Lugares</span>
      <span class="side-badge">em breve</span>
    </span>
    <a class="side-link" href="/orcamento" {% if page == 'orcamento' %}aria-current="page"{% endif %}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 11h18M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
      <span>Orçamento</span>
    </a>
    <span class="side-link soon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v5h5"></path><path d="M5 3h9l5 5v13H5z"></path></svg>
      <span>Documentos</span>
      <span class="side-badge">em breve</span>
    </span>
    <a class="side-link" href="/viagem" {% if page == 'viagem' %}aria-current="page"{% endif %}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M2 21c0-3.5 3-5.5 7-5.5s7 2 7 5.5"></path><path d="M17 7a3 3 0 110 6"></path><path d="M23 21c0-2.8-2-4.5-4.5-5"></path></svg>
      <span>Viajantes</span>
    </a>
  </nav>

  <div class="side-foot">
    <div class="theme-bar" id="theme-bar-desktop"></div>
  </div>
</aside>

<!-- Mobile: the tab bar -->
<nav class="tabbar" aria-label="Navegação principal">
  <a class="tab" href="/painel" {% if page == 'painel' %}aria-current="page"{% endif %}>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"></path></svg>
    <span>Início</span>
  </a>
  <a class="tab" href="/" {% if page == 'planejar' %}aria-current="page"{% endif %}>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M16 8l-5 3-3 5 5-3 3-5z"></path></svg>
    <span>Roteiro</span>
  </a>
  <a class="tab" href="/orcamento" {% if page == 'orcamento' %}aria-current="page"{% endif %}>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M3 11h18M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
    <span>Orçamento</span>
  </a>
  <a class="tab" href="/viagem" {% if page == 'viagem' %}aria-current="page"{% endif %}>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
    <span>Viajantes</span>
  </a>
</nav>

<div class="wrap">
  <div class="theme-bar" id="theme-bar-mobile"></div>
{% block content %}{% endblock %}
</div>

<script>
  // ── Theme switching ────────────────────────────────────────────────────
  // The five palettes from the Compass design. Stored per browser, because a
  // prototype has no account to hang a preference on.
  const THEMES = [
    { id: 'plum',       name: 'Midnight Plum',   bg: '#1a1020', accent: '#eb9a5c' },
    { id: 'ember',      name: 'Ember Charcoal',  bg: '#14110f', accent: '#e0a32e' },
    { id: 'blueprint',  name: 'Blueprint',       bg: '#10172e', accent: '#59c1f5' },
    { id: 'terracotta', name: 'Terracotta Dusk', bg: '#f6ece0', accent: '#b4552b' },
    { id: 'seaglass',   name: 'Sea Glass',       bg: '#eef3ee', accent: '#14655a' },
  ];

  function readTheme() {
    try { return localStorage.getItem('compass-theme'); } catch (e) { return null; }
  }
  function applyTheme(id) {
    document.documentElement.setAttribute('data-theme', id);
    try { localStorage.setItem('compass-theme', id); } catch (e) { /* private mode */ }
    document.querySelectorAll('.swatch').forEach(s =>
      s.setAttribute('aria-pressed', String(s.dataset.theme === id)));
    const meta = document.querySelector('meta[name="theme-color"]');
    const t = THEMES.find(t => t.id === id);
    if (meta && t) meta.setAttribute('content', t.bg);
  }

  function buildThemeBar(host) {
    if (!host) return;
    host.innerHTML = '<span class="lbl">Aparência</span>';
    THEMES.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch';
      b.dataset.theme = t.id;
      b.title = t.name;
      b.setAttribute('aria-label', 'Tema ' + t.name);
      b.style.background = 'linear-gradient(135deg, ' + t.bg + ' 50%, ' + t.accent + ' 50%)';
      b.addEventListener('click', () => applyTheme(t.id));
      host.appendChild(b);
    });
  }

  buildThemeBar(document.getElementById('theme-bar-desktop'));
  buildThemeBar(document.getElementById('theme-bar-mobile'));
  applyTheme(readTheme() || 'plum');

  // ── Prototype controls ─────────────────────────────────────────────────
  // They react so the interaction reads as real, but nothing is stored —
  // there is no account yet to store it against.
  document.querySelectorAll('[data-soon]').forEach((el) => {
    const label = el.querySelector('span') || el;
    const original = label.textContent;
    el.addEventListener('click', () => {
      label.textContent = 'Ainda não funciona';
      setTimeout(() => { label.textContent = original; }, 1800);
    });
  });

  document.querySelectorAll('.switch').forEach((sw) => {
    sw.addEventListener('click', () => {
      sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    });
  });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
